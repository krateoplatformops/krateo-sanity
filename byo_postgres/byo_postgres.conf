# ==============================================================================
# byo_postgres.conf - configuration for the Bring Your Own PostgreSQL e2e
# ==============================================================================
# Every value can be overridden from the environment, e.g.
#   KRATEO_VERSION=3.0.0 ./e2e.sh
# ==============================================================================

# --- Krateo install -----------------------------------------------------------
# REQUIRED and intentionally NOT defaulted.
#
# This test exercises the published "Bring Your Own PostgreSQL" guide, which
# promises "PostgreSQL 13+, no extensions, no superuser". That promise only
# holds for a deviser build that uses the native gen_random_uuid() function
# (no pgcrypto). You MUST pin a Krateo release whose bundled deviser includes
# that migration, otherwise schema bootstrap fails against an owner-only role
# with no CREATE EXTENSION rights -- and that failure is correct, not a bug.
KRATEO_VERSION="${KRATEO_VERSION:-}"

# krateoctl install namespace (krateoctl default is krateo-system).
KRATEO_SYSTEM_NAMESPACE="${KRATEO_SYSTEM_NAMESPACE:-krateo-system}"

# Comma-separated profiles passed to `krateoctl install apply`.
# no-cnpg          -> resolved from the remote releases repo (disables CNPG)
# custom-cnpg-profile -> resolved locally from manifests/ (points at our DB)
BYO_PROFILE_NAME="${BYO_PROFILE_NAME:-custom-cnpg-profile}"

# --- optional: override the deviser image -------------------------------------
# Pin a specific deviser image instead of the one the release ships. This lets
# the test validate a pre-release deviser build (e.g. one carrying an unreleased
# migration) against the documented BYO flow. When DEVISER_IMAGE_REPOSITORY is
# empty, the released image is used and this is a no-op.
#   DEVISER_KIND_LOAD=true  -> `kind load` the image into the cluster, so it works
#                              regardless of registry visibility or node arch.
DEVISER_IMAGE_REPOSITORY="${DEVISER_IMAGE_REPOSITORY:-}"
DEVISER_IMAGE_TAG="${DEVISER_IMAGE_TAG:-}"
DEVISER_IMAGE_PULL_POLICY="${DEVISER_IMAGE_PULL_POLICY:-IfNotPresent}"
DEVISER_KIND_LOAD="${DEVISER_KIND_LOAD:-false}"
BYO_DEVISER_PROFILE_NAME="${BYO_DEVISER_PROFILE_NAME:-custom-deviser-image}"

# --- kind cluster (dedicated + ephemeral) -------------------------------------
BYO_CLUSTER_NAME="${BYO_CLUSTER_NAME:-krateo-byo-e2e}"
BYO_CLUSTER_IMAGE="${BYO_CLUSTER_IMAGE:-kindest/node:v1.33.4}"
# Set to "true" to keep the cluster after the run (for debugging).
BYO_KEEP_CLUSTER="${BYO_KEEP_CLUSTER:-false}"

# --- external ("bring your own") PostgreSQL -----------------------------------
# A plain PostgreSQL Deployment, NOT managed by CNPG, standing in for the
# user's pre-existing database.
EXTERNAL_DB_NAMESPACE="${EXTERNAL_DB_NAMESPACE:-external-db}"
EXTERNAL_DB_NAME="${EXTERNAL_DB_NAME:-postgres}"          # Deployment + Service name
POSTGRES_IMAGE="${POSTGRES_IMAGE:-postgres:17-alpine}"    # guide requires >= 13
POSTGRES_SUPERUSER="${POSTGRES_SUPERUSER:-postgres}"
POSTGRES_SUPERUSER_PASSWORD="${POSTGRES_SUPERUSER_PASSWORD:-postgres}"

# --- Krateo database + role (must match the guide verbatim) -------------------
# These are exactly the identifiers from step 1 of the guide:
#   CREATE USER "krateo-db-user" WITH ENCRYPTED PASSWORD 'your_password';
#   CREATE DATABASE "krateo-db" OWNER "krateo-db-user";
# KRATEO_DB_USER must equal the DB_USER value krateoctl writes into the
# krateo-db secret (its default is the literal "krateo-db-user").
KRATEO_DB_NAME="${KRATEO_DB_NAME:-krateo-db}"
KRATEO_DB_USER="${KRATEO_DB_USER:-krateo-db-user}"
KRATEO_DB_PASS="${KRATEO_DB_PASS:-your_password}"
KRATEO_DB_PORT="${KRATEO_DB_PORT:-5432}"

# --- timeouts (seconds) -------------------------------------------------------
BYO_DB_TIMEOUT="${BYO_DB_TIMEOUT:-300}"
BYO_INSTALL_COMPONENT_TIMEOUT="${BYO_INSTALL_COMPONENT_TIMEOUT:-600}"
